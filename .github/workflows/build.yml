name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build, test, package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # There is no solution file: every step names its project explicitly.
      - name: Restore
        run: dotnet restore "tests/PipSentry.Tests/PipSentry.Tests.csproj"

      - name: Build
        run: dotnet build "tests/PipSentry.Tests/PipSentry.Tests.csproj" -c Release --no-restore

      - name: Test
        run: dotnet test "tests/PipSentry.Tests/PipSentry.Tests.csproj" -c Release --no-build

      - name: Publish single-file portable executable
        run: dotnet publish "src/PipSentry/PipSentry.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "dist/PipSentry-portable"

      - name: Install WiX toolset and UI extension
        shell: pwsh
        run: |
          $wix = Join-Path $env:GITHUB_WORKSPACE ".tools/wix/wix.exe"
          dotnet tool install --tool-path .tools/wix wix --version "5.0.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # -g installs into %USERPROFILE%\.wix; without it the add is a no-op.
          & $wix extension add -g "WixToolset.UI.wixext/5.0.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI
        shell: pwsh
        working-directory: packaging
        run: |
          # PipSentry.wxs resolves ..\src and ..\dist relative to this folder, like build.ps1.
          $wix = Join-Path $env:GITHUB_WORKSPACE ".tools/wix/wix.exe"
          $msi = Join-Path $env:GITHUB_WORKSPACE "dist/PipSentry.msi"
          & $wix build -arch x64 -ext "WixToolset.UI.wixext/5.0.2" "PipSentry.wxs" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: PipSentry-portable
          path: dist/PipSentry-portable/PipSentry.exe
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: PipSentry-msi
          path: dist/PipSentry.msi
          if-no-files-found: error