name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build, test, package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tests
        run: dotnet restore "tests/PipSentry.Tests/PipSentry.Tests.csproj"

      - name: Build tests
        run: dotnet build "tests/PipSentry.Tests/PipSentry.Tests.csproj" -c Release --no-restore

      - name: Test
        run: dotnet test "tests/PipSentry.Tests/PipSentry.Tests.csproj" -c Release --no-build

      - name: Build portable exe and MSI
        shell: pwsh
        run: ./build.ps1 -Dotnet dotnet

      # Optional: set SIGNING_PFX_BASE64 (base64 of the .pfx) and
      # SIGNING_PFX_PASSWORD as repository secrets to sign both artifacts.
      - name: Sign artifacts
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { Write-Host "No SIGNING_PFX_BASE64 secret; artifacts stay unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          ./sign.ps1 -PfxPath $pfx -PfxPassword $env:SIGNING_PFX_PASSWORD

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: PipSentry-portable
          path: dist/PipSentry-portable/PipSentry.exe
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: PipSentry-msi
          path: dist/PipSentry-*-x64.msi
          if-no-files-found: error
